<form id="form-edit-usuario" class="formulario-edicion-personalizado">
    <label>Nombre</label>
    <input id="edit-nombre" name="nombre" class="entrada-edicion" type="text">
    
    <label>Apellidos</label>
    <input id="edit-apellidos" name="apellidos" class="entrada-edicion" type="text">
    
    <label>Email</label>
    <input id="edit-email" name="email" class="entrada-edicion" type="email">
    
    <label>Teléfono</label>
    <input id="edit-telefono" name="telefono" class="entrada-edicion" type="text">
    
    <label>Sexo</label>
    <select id="edit-sexo" name="sexo" class="entrada-edicion">
        <option value="H">Hombre</option>
        <option value="M">Mujer</option>
    </select>
    
    <label>Fecha Nacimiento</label>
    <input id="edit-fecha" name="fecha_nacimiento" class="entrada-edicion" type="date">
</form>
