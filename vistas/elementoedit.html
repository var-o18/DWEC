<form id="form-edit-elemento" class="custom-edit-form">
    <label>nombre</label>
    <input id="edit-nombre" name="nombre" class="edit-input" type="text">
    
    <label>descripcion</label>
    <textarea id="edit-descripcion" name="descripcion" class="edit-input" style="height: 100px;"></textarea>
    
    <label>nserie</label>
    <input id="edit-nserie" name="nserie" class="edit-input" type="text">
    
    <label>estado</label>
    <select id="edit-estado" name="estado" class="edit-input">
        <option value="Operativo">Activo</option>
        <option value="Mantenimiento">Mantenimiento</option>
        <option value="Baja">Inactivo</option>
    </select>
    
    <label>prioridad</label>
    <select id="edit-prioridad" name="prioridad" class="edit-input">
        <option value="1">Baja</option>
        <option value="2">Media</option>
        <option value="3">Alta</option>
    </select>
</form>
