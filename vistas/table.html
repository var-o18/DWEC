<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos</title>
    <script type="text/javascript" src="../js/index.js" defer></script>
    <link rel="stylesheet" href="../css/index.css">
    <!-- Librerías Externas -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <header>
        <h1>Listado de Alumnos</h1>
    </header>
    <div style="margin: 20px;">
        <input type="text" id="filtro" placeholder="Filtrar por nombre o apellidos...">
        <button onclick="window.location.href='form.html'" style="float: right;">Nuevo Alumno</button>
    </div>
    <table id="tablaElementos" border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Sexo</th>
                <th>Fecha Nacimiento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="../js/nav.js"></script>
</body>

</html>
