<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumno</title>
    <link rel="stylesheet" href="../css/index.css">
    <script src="../js/index.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <header>
        <h1 id="formLegend">Nuevo Alumno</h1>
    </header>
    
    <form id="registroForm">
        <fieldset>
            <div>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div>
                <label for="apellidos">Apellidos:</label><br>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>

            <div>
                <label for="password">Contraseña (max 32 carc.):</label><br>
                <input type="password" id="password" name="password" required maxlength="32">
            </div>

            <div>
                <label for="telefono">Teléfono:</label><br>
                <input type="text" id="telefono" name="telefono">
            </div>

            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
            </div>

            <div>
                <label for="sexo">Sexo:</label><br>
                <select id="sexo" name="sexo">
                    <option value="">Seleccione...</option>
                    <option value="H">Hombre</option>
                    <option value="M">Mujer</option>
                </select>
            </div>

            <div>
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label><br>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
        </fieldset><br>

        <button type="submit" id="submitBtn">Crear Alumno</button>
        <button type="button" id="cancelBtn" onclick="window.location.href='table.html'"
            style="background-color: #f44336; margin-left: 10px;">Cancelar</button>
    </form><br>

    <script src="../js/nav.js"></script>
</body>

</html>
